# Runs the tests and builds the web app on every push and pull request. Pushes to main also publish the web app on
# GitHub Pages: https://anderssonrobert1985.github.io/CourtCompanion/
name: Web app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment halfway; a newer one waits for it instead.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        run: ./gradlew --console=plain :shared:desktopTest :cli:test :web:wasmJsBrowserDistribution

      - name: Drop the source map
        run: rm -f web/build/dist/wasmJs/productionExecutable/*.map

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build/dist/wasmJs/productionExecutable

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
